<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swimming School</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
    }

    #canvas-container {
      position: relative;
      /* width/height set by JS */
    }

    #gl-canvas {
      display: block;
      position: absolute;
      top: 0; left: 0;
    }

    #overlay-canvas {
      display: block;
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
    }

    #ui {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(0,0,0,0.5);
      border-radius: 24px;
      padding: 10px 22px;
      backdrop-filter: blur(6px);
      white-space: nowrap;
      z-index: 10;
    }

    #ui label { color: #ccc; font-size: 13px; letter-spacing: 0.04em; }
    #ui span   { color: #fff; font-size: 13px; min-width: 24px; text-align: center; }

    input[type=range] {
      -webkit-appearance: none;
      width: 160px; height: 4px;
      border-radius: 2px;
      background: #555;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #aaa;
      cursor: pointer;
    }

    #sign-btn, #hold-btn, #mode-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #ccc;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 14px;
      cursor: pointer;
    }
    #sign-btn:hover, #hold-btn:hover, #mode-btn:hover { background: rgba(255,255,255,0.18); }
    #sign-btn.on, #hold-btn.on { background: rgba(255,255,255,0.3); color: #fff; }
    #debug {
      position: absolute; top: 8px; left: 8px; z-index: 10;
      color: #9f9; font: 11px/1.3 monospace; background: rgba(0,0,0,0.6);
      padding: 6px 10px; border-radius: 6px; pointer-events: none; white-space: pre;
    }
    #hint {
      position: absolute; top: 10px; right: 14px; z-index: 10;
      color: rgba(128,128,128,0.9); font-size: 12px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="gl-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
    <pre id="debug" hidden></pre>
    <div id="hint">click the water to push the swimmers</div>
    <div id="ui">
      <label>Solitary</label>
      <input type="range" id="slider" min="1" max="20" value="7" />
      <label>School</label>
      <span id="count">7</span>
      <label>Efficiency</label>
      <span id="eff" style="min-width:40px">–</span>
      <label>Offset</label>
      <span id="err" style="min-width:40px">–</span>
      <button id="hold-btn" class="on" title="Baseline controller that returns swimmers to their slot">Hold</button>
      <button id="sign-btn" title="Colour vortices by rotation direction">± Sign</button>
      <button id="mode-btn">☀ Light</button>
    </div>
  </div>
  <script type="module" src="src/main.js?v=10"></script>
</body>
</html>
