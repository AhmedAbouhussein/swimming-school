<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swimming School</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
    #canvas-container { position: relative; }
    canvas { display: block; }
    #ui {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(0,0,0,0.45);
      border-radius: 24px;
      padding: 10px 22px;
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }
    #ui label { color: #ccc; font-size: 13px; letter-spacing: 0.04em; }
    #ui span { color: #fff; font-size: 13px; min-width: 24px; text-align: center; }
    input[type=range] {
      -webkit-appearance: none;
      width: 160px;
      height: 4px;
      border-radius: 2px;
      background: #444;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #aaa;
      cursor: pointer;
    }
    #mode-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #ccc;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 14px;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    #mode-btn:hover { background: rgba(255,255,255,0.18); }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="c"></canvas>
    <div id="ui">
      <label>Solitary</label>
      <input type="range" id="slider" min="1" max="20" value="7" />
      <label>School</label>
      <span id="count">7</span>
      <button id="mode-btn">☀ Light</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
